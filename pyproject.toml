[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simslink"
version = "0.1.0"
description = "Desktop mod manager for The Sims 4 on Linux, with automated crash diagnosis"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "flet>=0.24",
    "watchdog>=4.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "httpx>=0.27",
]

[project.scripts]
simslink = "main:main"
# Alongside the Flet entry point above during the FastAPI/pywebview migration
# (see CLAUDE.md's "Current project status") — not yet the default.
simslink-web = "desktop:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["*.py", "ui/*.py", "i18n/*.json", "backend/*.py", "frontend/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
