name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No system packages needed here: pywebview's own pip dependencies
      # (bottle, proxy_tools, typing_extensions) are pure Python — the
      # GTK/WebKit bits README's "Getting started" mentions are only loaded
      # at runtime to actually open a native window, which nothing the test
      # suite touches does (desktop.py, the only importer of pywebview
      # itself, is out of pytest's scope). A prior version of this workflow
      # installed gir1.2-webkit2-4.0 defensively anyway — removed after it
      # broke CI outright: that exact package name doesn't exist on
      # ubuntu-latest (Ubuntu renamed it to gir1.2-webkit2-4.1), and it was
      # never actually required in the first place.
      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest
